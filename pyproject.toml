[project]
name = "autosar-sr-patcher"
version = "0.1.0"
description = "Safe incremental patching of generated AUTOSAR S/R ARXML"
requires-python = ">=3.9"
dependencies = ["lxml>=5.3,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1", "pyinstaller>=6.16,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
